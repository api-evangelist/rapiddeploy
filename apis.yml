aid: rapiddeploy
name: RapidDeploy
description: >-
  RapidDeploy is a cloud-native Next Generation 9-1-1 (NG911) software company founded in 2013 in
  South Africa and headquartered in Austin, Texas from 2018. It builds call-taking, dispatch, mapping
  and analytics software for Public Safety Answering Points (PSAPs) on Microsoft Azure: Nimbus CAD
  (cloud computer-aided dispatch), Radius Mapping (NG911 primary call-taking tactical map with a deep
  ESRI integration and supplemental location data sources), Lightning (a first-responder mobile
  application) and Eclipse Analytics (response-time and staffing analytics). The company was acquired
  by Motorola Solutions and folded into its Command Center software portfolio; rapiddeploy.com and
  every path beneath it now HTTP 301 to a Motorola Solutions NG9-1-1 product page. RapidDeploy
  markets an open-API framework for integrating third-party systems such as Priority Dispatch for
  police, fire and EMS, but publishes no public API reference or machine-readable contract.
