apis:
- aid: rapiddeploy-platform
  name: RapidDeploy Platform API
  description: >-
    The RapidDeploy platform API host that backs Nimbus CAD, Radius Mapping, Lightning and Eclipse
    Analytics. The host is live and answers with a JSON envelope, but every anonymous path returns
    404 "Resource not found" and RapidDeploy publishes no public reference or machine-readable
    contract for it. Access is issued to agency tenants through the company's Auth0 tenant at
    auth.rapiddeploy.com. Recorded here because the host was probed directly, not because a public
    API product is documented.
  humanURL: https://www.motorolasolutions.com/en_us/products/command-center-software/public-safety-software/ng9-1-1-call-management.html
